# Reglas de categorizacion del cash flow de Nexiu.
# Se evaluan EN ORDEN: gana la primera regla que matchea.
# Campos de una regla:
#   match:  patron regex (case-insensitive) contra descripcion/merchant/bank description
#   card:   (opcional) ultimos 4 digitos de la tarjeta
#   amount: (opcional) importe exacto en USD (valor absoluto)
#   group / category: agrupador y linea del cash flow
#   flow:   IN | OUT | TRANSFER  (TRANSFER se excluye del neto consolidado)

rules:
  # ---------- Reglas especiales (logica distinta, pedidas por Ivan) ----------
  # 1) Facebook pagado con la tarjeta terminada en 2354 -> Platform / Messaging
  - id: fb_platform
    match: "facebook|facebk"
    card: "2354"
    group: "Platform"
    category: "Platform / Messaging"
    flow: OUT

  # 2) Suscripcion Anthropic de 200 USD/mes -> Tech salaries
  - id: anthropic_200
    match: "anthropic|claude"
    amount: 200.00
    group: "Payroll & Contractors"
    category: "Tech salaries"
    flow: OUT

  # ---------- Ingresos ----------
  - id: rev_clicoh
    match: "clicoh"
    group: "Revenue"
    category: "Client collections"
    flow: IN
  - id: rev_uvitech
    match: "uvi tech|vendbill"
    group: "Revenue"
    category: "Client collections"
    flow: IN
  - id: funding_ivan_in
    match: "^ivan amelong$|wise us inc"
    group: "Financing"
    category: "Shareholder funding / loans"
    flow: IN
  - id: funding_bridge
    match: "bridge arx"
    group: "Financing"
    category: "Shareholder funding / loans"
    flow: IN
    review: "Entrada desde DolarApp/Bridge. Confirmar si es transferencia interna entre cuentas propias (entonces TRANSFER) o aporte."

  # ---------- Salidas ----------
  - id: owner_draw
    match: "ivan amelong - wise|ivan amelong -"
    group: "Financing"
    category: "Owner draw / loan repayment"
    flow: OUT

  - id: ads_meta
    match: "facebook|facebk|instagram|meta platforms"
    group: "Marketing"
    category: "Paid ads - Meta"
    flow: OUT
  - id: ads_tiktok
    match: "tiktok"
    group: "Marketing"
    category: "Paid ads - TikTok"
    flow: OUT

  - id: recruiting
    match: "indeed|occ\\.com|merpago\\*occ|linkedin"
    group: "G&A"
    category: "Recruiting"
    flow: OUT

  - id: accounting
    match: "ricardo lopez|honorarios contables"
    group: "G&A"
    category: "Accounting & legal"
    flow: OUT

  - id: facilities
    match: "wework"
    group: "G&A"
    category: "Facilities / coworking"
    flow: OUT

  - id: contractors
    match: "monica tonanzin|alex tigselema|optimus digital|servicios digitales"
    group: "Payroll & Contractors"
    category: "Contractors"
    flow: OUT

  - id: software
    match: "anthropic|claude|openai|vercel|lovable|recall|cookiebot|unstract|google cloud|whaticket|heyreach|github|supabase|twilio"
    group: "Tech"
    category: "Software & infra"
    flow: OUT

  - id: bank_fees
    match: "intl\\. transaction fee|intl\\. wire fee|wire fee|fee"
    group: "G&A"
    category: "Bank fees & FX"
    flow: OUT

# Cualquier movimiento sin regla cae aqui y se reporta en la seccion "Sin clasificar"
fallback:
  group: "Uncategorized"
  category: "Sin clasificar"

# Orden de presentacion de los agrupadores en el reporte
group_order: ["Revenue", "Marketing", "Platform", "Tech", "Payroll & Contractors", "G&A", "Financing", "Uncategorized"]
